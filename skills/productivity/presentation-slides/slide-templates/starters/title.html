st-spectral-edge.png" alt="" aria-hidden="true"><div class="title-copy"><h1 class="title" data-slot="title">Ideas that move<br>the world.</h1><p class="meta"><span data-slot="presenter">Presenter Name</span> · <span data-slot="date">Presentation Date</span></p></div><nav class="slide-page-turner" aria-label="Slide 1 of 3"><button type="button" aria-label="Previous slide" disabled>‹</button><output aria-label="Page 1 of 3">1 / 3</output><button type="button" aria-label="Next slide" >›</button></nav></section></main><script>function fit(){var s=document.querySelector('.slide-stage');s.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',fit);fit()</script>
