<!doctype html><html lang="en"><meta charset="utf-8"><title>BIL Regular</title><style>*{box-sizing:border-box}html,body{margin:0;background:#f7f8fa;color:#111318;font-family:"Helvetica Neue",sans-serif}.viewport{width:100vw;height:100vh;overflow:hidden;position:relative}.slide-stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#fff;padding:96px 120px}.logo{position:absolute;right:44px;top:39px;width:422px}.title{position:absolute;left:120px;top:60px;max-width:960px;margin:0;font:600 60px/1.02 Inter,sans-serif;letter-spacing:-.03em}.main{width:100%}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}.slide-page-turner{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:14px;height:56px;box-sizing:border-box;padding:6px 12px;background:#111318;color:#fff;border:0;border-radius:999px;width:max-content;z-index:8}.slide-page-turner button{width:44px;height:44px;min-width:44px;border:0;border-radius:50%;background:transparent;color:#fff;font:28px/1 Arial,sans-serif}.slide-page-turner button:disabled{opacity:.35}.slide-page-turner output{min-width:72px;text-align:center;font:16px/1 "Helvetica Neue",Arial,sans-serif;white-space:nowrap}</style><body><main class="viewport"><section class="slide-stage" aria-label="BIL Regular layout"><img class="logo" data-slot="logo" alt="Approved BIL logo" src="../../design-system/assets/logos/black_duke_bigideaslab.png"><h1 class="title" data-slot="title">Study overview</h1><div class="main" data-slot="main"></div><nav class="slide-page-turner" aria-label="Slide 3 of 3"><button type="button" aria-label="Previous slide" >‹</button><output aria-label="Page 3 of 3">3 / 3</output><button type="button" aria-label="Next slide" disabled>›</button></nav></section></main><script>function fit(){var s=document.querySelector('.slide-stage');s.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'}addEventListener('resize',fit);fit()</script>
