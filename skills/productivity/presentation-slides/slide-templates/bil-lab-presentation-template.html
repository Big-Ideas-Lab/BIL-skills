<!doctype html><html lang="en"><meta charset="utf-8"><title>BIL V2 presentation layouts</title><style>:root{--navy:#012169;--blue:#00539b;--cyan:#70b2e0;--ink:#111318}*{box-sizing:border-box}html,body{margin:0;background:#f7f8fa;color:var(--ink);font-family:"Helvetica Neue",sans-serif}.viewport{position:relative;width:100vw;height:100vh;overflow:hidden}.stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center;background:#fff;padding:120px;visibility:hidden;opacity:0;pointer-events:none}.stage.active{visibility:visible;opacity:1;pointer-events:auto}.logo{position:absolute;right:44px;top:39px;width:422px;z-index:5}.title{position:relative;z-index:4;margin:220px 0 28px;max-width:1260px;font:400 112px/.96 Georgia,"Times New Roman",serif}.meta{position:relative;z-index:4;font-size:30px;color:#68717d}.opening-optical{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:1;pointer-events:none}.media{position:absolute;left:370px;top:270px;width:1180px;height:660px;object-fit:contain;border:0;outline:0;border-radius:32px;overflow:hidden;background:#E5E7EB;z-index:3}.title-opening .title-copy{position:absolute;left:134px;top:378px;width:672px;max-width:672px}.title-opening .title{position:relative;left:auto;top:auto;max-width:none;margin:0;font-size:80px;line-height:1.08;font-weight:400}.title-opening .meta{position:relative;left:auto;top:auto;margin:25px 0 0;width:1100px;max-width:1100px;white-space:nowrap;font:32px/1.3 "Helvetica Neue",Arial,sans-serif;color:#59636b;letter-spacing:0}.title-media .title{position:absolute;left:120px;top:54px;max-width:960px;margin:0;font:600 60px/1.02 Inter,sans-serif;letter-spacing:-.03em}.title-media .meta{position:absolute;left:120px;top:196px;margin:0;width:1100px;max-width:1100px;white-space:nowrap;font:24px/1.3 "Helvetica Neue",Arial,sans-serif;color:#59636b}.title-media .media{left:370px;top:270px;width:1180px;height:660px;border:0;outline:0;border-radius:32px;overflow:hidden;object-fit:contain}.media img{position:absolute;width:96px;height:96px;left:50%;top:50%;transform:translate(-50%,-50%);object-fit:contain}.regular .title{position:absolute;left:120px;top:60px;max-width:960px;margin:0;font:600 60px/1.02 Inter,sans-serif;letter-spacing:-.03em}.main{width:100%}.bil-page-turner{position:fixed;z-index:8;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;gap:14px;height:56px;box-sizing:border-box;padding:6px 12px;background:#111318;color:#fff;border:0;border-radius:999px;width:max-content}.bil-page-turner button{width:44px;height:44px;min-width:44px;border:0;border-radius:50%;background:transparent;color:#fff;font:28px/1 Arial,sans-serif;cursor:pointer}.bil-page-turner button:hover{background:rgba(255,255,255,.12)}.bil-page-turner button:active{background:rgba(255,255,255,.2)}.bil-page-turner button:disabled{opacity:.35;cursor:not-allowed}.bil-page-turner button:focus-visible{outline:3px solid #78b8e7;outline-offset:2px}.bil-page-tracker{min-width:72px;text-align:center;color:#fff;font:16px/1 "Helvetica Neue",Arial,sans-serif;white-space:nowrap}.controls{position:fixed;z-index:8;left:16px;bottom:16px;display:flex;gap:8px}.controls button{padding:10px 14px;background:#fff;border:1px solid var(--navy);color:var(--navy)}@media(prefers-reduced-motion:reduce){*{transition:none!important}}@media print{.viewport{height:auto;overflow:visible}.stage{position:relative;left:auto;top:auto;transform:none!important;visibility:visible;opacity:1;pointer-events:auto;page-break-after:always}.controls,.bil-page-turner{display:none}}</style><body><main class="viewport"><section id="title" class="stage active title-opening"><img class="logo" alt="Approved BIL logo" src="../design-system/assets/logos/black_duke_bigideaslab.png"><img class="opening-optical" src="../design-system/assets/decor/bil-opening-sunburst-spectral-edge.png" alt="" aria-hidden="true"><div class="title-copy"><h1 class="title">Ideas that move<br>the world.</h1><p class="meta"><span data-slot="presenter">Presenter Name</span> · <span data-slot="date">Presentation Date</span></p></div></section><section id="title-media" class="stage title-media"><img class="logo" alt="Approved BIL logo" src="../design-system/assets/logos/black_duke_bigideaslab.png"><img class="opening-optical" src="../design-system/assets/decor/bil-opening-sunburst-spectral-edge.png" alt="" aria-hidden="true"><h1 class="title">Ideas that move<br>the world.</h1><p class="meta"><span data-slot="presenter">Presenter Name</span> · <span data-slot="date">Presentation Date</span></p><figure class="media" role="img" aria-label="Media placeholder"><img src="../design-system/assets/icons/lucide-image.svg" alt="" aria-hidden="true"></figure></section><section id="regular" class="stage regular"><img class="logo" alt="Approved BIL logo" src="../design-system/assets/logos/black_duke_bigideaslab.png"><h2 class="title">Study overview</h2><div class="main" data-slot="main"></div></section></main><nav class="bil-page-turner" data-page-turner-slide data-current="1" data-total="3" aria-label="Slide navigation"><button type="button" data-page-previous aria-label="Previous slide">‹</button><output class="bil-page-tracker" aria-live="polite">1 / 3</output><button type="button" data-page-next aria-label="Next slide">›</button></nav><script>function fit(){document.querySelectorAll('.stage').forEach(function(s){s.style.transform='translate(-50%,-50%) scale('+Math.min(innerWidth/1920,innerHeight/1080)+')'})}var turner=document.querySelector('[data-page-turner-slide]'),pages=['title','title-media','regular'],currentPage=0,prev=turner.querySelector('[data-page-previous]'),next=turner.querySelector('[data-page-next]'),out=turner.querySelector('.bil-page-tracker');function renderPage(){document.querySelectorAll('.stage').forEach(function(s){s.classList.toggle('active',s.id===pages[currentPage])});out.textContent=(currentPage+1)+' / 3';out.setAttribute('aria-label','Page '+(currentPage+1)+' of 3');prev.disabled=currentPage===0;next.disabled=currentPage===2;fit()}prev.onclick=function(){if(currentPage>0){currentPage--;renderPage()}};next.onclick=function(){if(currentPage<2){currentPage++;renderPage()}};addEventListener('keydown',function(e){if(e.key==='ArrowLeft'){prev.click()}else if(e.key==='ArrowRight'){next.click()}});addEventListener('resize',fit);renderPage()</script>
